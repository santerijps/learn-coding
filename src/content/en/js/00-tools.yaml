id: js-tyokalut
title: 'Getting set up: Node.js and Bun'
summary: What runs JavaScript outside the browser, how to install it on Windows and Mac, and how to run your own programs.
theory: |
  JavaScript started as the language of web pages, and every browser can still run it. To run JavaScript on your own computer, outside a browser (scripts, servers, command-line tools), you need a **runtime**: a program that reads your `.js` file and runs it.

  You don't need to install anything to follow this course, because the exercises run in your browser. You'll need a runtime once you write your own programs.

  ### Node.js and Bun

  - **Node.js** (2009) is the most widely used JavaScript runtime. It comes with **npm**, the package manager that installs libraries from the npm registry, the largest collection of code packages in the world. Most tutorials, jobs and hosting services assume Node.
  - **Bun** is a newer runtime built for speed. It's an all-in-one tool: runtime, package manager, test runner and bundler. It runs TypeScript files directly and works with most npm packages, so most Node code also runs on Bun.
  - **Deno** is a third option, made by the original author of Node, with a focus on security and built-in tools.

  Node and Bun run the same language, so everything you learn in this course works in both. A good rule: use Node when you want the safest, best-documented choice, and try Bun when you want speed and fewer tools to set up.

  Node releases a new major version regularly. Choose the **LTS** (Long-Term Support) version: it's the stable one that gets fixes for years.

  ### How JavaScript compares with other languages

  - **Python** is also dynamic and easy to start with. Python is strongest in data science, machine learning and automation; JavaScript is the only language browsers run natively, so it's unavoidable for the web.
  - **TypeScript** is JavaScript with type annotations. It's checked before running and then turned into plain JavaScript (Bun and Deno run it directly).
  - **Java, C# and Go** are compiled and statically typed: more ceremony up front, but the compiler catches more mistakes before the program runs.

  ### The terminal

  You install and run programs by typing commands in a **terminal**.

  - **Windows:** open the Start menu and search for **Terminal** (Windows Terminal, which runs PowerShell).
  - **Mac:** press **⌘ + Space**, type **Terminal** and press Enter.

  A code editor helps too. **Visual Studio Code** is free and works on both.

  ### Installing on Windows

  Download the LTS installer from **nodejs.org** and run it, or install it from the terminal with winget:

  ```powershell
  winget install OpenJS.NodeJS.LTS
  ```

  Bun is installed with a single command in PowerShell:

  ```powershell
  powershell -c "irm bun.sh/install.ps1 | iex"
  ```

  ### Installing on a Mac

  Download the LTS installer (`.pkg`) from **nodejs.org**, or use Homebrew if you have it:

  ```bash
  brew install node
  ```

  Bun is installed with:

  ```bash
  curl -fsSL https://bun.sh/install | bash
  ```

  ### Checking the installation

  Close and reopen the terminal so it finds the new commands, then check the versions. The commands are the same on Windows and Mac:

  ```bash
  node --version
  npm --version
  bun --version
  ```

  If you get "command not found" (Mac) or "not recognized" (Windows), the terminal was opened before the installation finished: open a new one.

  ### Running a program

  Make a folder, and inside it a file `hello.js`:

  ```js
  console.log("Hello world");
  ```

  Go to the folder with `cd` and run the file. On Windows the path uses `\` and on a Mac `/`, but PowerShell accepts `/` as well:

  ```bash
  cd Documents/code     # Windows: cd Documents\code
  node hello.js         # run with Node
  bun hello.js          # run with Bun
  ```

  Useful extras:

  - `node --watch hello.js` or `bun --watch hello.js` runs the file again every time you save it.
  - `node` on its own opens an interactive prompt (a REPL) where you can try out code line by line. Leave it with `.exit` or by pressing Ctrl + C twice.
  - **Ctrl + C** stops a program that keeps running, such as a server.

  ### Projects and packages

  A project lists its packages and scripts in the file `package.json`:

  ```bash
  npm init -y           # create package.json      (Bun: bun init)
  npm install lodash    # install a package        (Bun: bun add lodash)
  npm install           # install everything listed in package.json  (Bun: bun install)
  npm run dev           # run the "dev" script     (Bun: bun run dev)
  ```
exercises:
  - type: choice
    question: What is Node.js?
    options:
      - A runtime that runs JavaScript outside the browser
      - A programming language that replaces JavaScript
      - A code editor for JavaScript
      - A website for hosting JavaScript programs
    answer: 0
    explanation: Node.js is a runtime. It runs the same JavaScript language as the browser, but on your own computer. Bun and Deno are other runtimes.
  - type: choice
    question: Which Node.js version should a beginner install?
    options:
      - The LTS version
      - The oldest version still available
      - Any nightly build
      - It doesn't matter, versions can't differ
    answer: 0
    explanation: LTS (Long-Term Support) versions are the stable ones that get fixes for years. That's what tutorials and hosting services expect.
  - type: blank
    question: Complete the command that checks which version of Node.js is installed.
    code: |
      node ___
    blanks:
      - ['--version', '-v']
    explanation: '`node --version` (or the short form `node -v`) prints the installed version. It works the same on Windows and Mac.'
  - type: bug
    question: These commands should run the file `hello.js` in the folder `code`. Which line is wrong?
    code: |
      cd code
      ls
      node run hello.js
    bugLine: 3
    explanation: 'Node runs a file directly: `node hello.js`. (`npm run` and `bun run` run scripts from package.json, and Bun also accepts `bun run hello.js`, but Node has no `run` command.)'
  - type: choice
    question: You installed Node.js, but the terminal says `node` is not recognized. What's the most likely fix?
    options:
      - Close the terminal and open a new one
      - Reinstall the operating system
      - Rename the file to hello.node
      - Run the file in a browser instead
    answer: 0
    explanation: A terminal opened before the installation doesn't know about the new command yet. A new terminal does.
cards:
  - id: js-tools-node-run
    prompt: Run the file `hello.js` with Node.js.
    check: match
    language: shell
    solution: node hello.js
  - id: js-tools-bun-run
    prompt: Run the file `hello.js` with Bun.
    check: match
    language: shell
    solution: bun hello.js
    accepted:
      - bun run hello.js
  - id: js-tools-node-version
    prompt: Check which version of Node.js is installed.
    check: match
    language: shell
    solution: node --version
    accepted:
      - node -v
  - id: js-tools-bun-version
    prompt: Check which version of Bun is installed.
    check: match
    language: shell
    solution: bun --version
    accepted:
      - bun -v
  - id: js-tools-node-watch
    prompt: Run `server.js` with Node so that it restarts every time the file is saved.
    check: match
    language: shell
    solution: node --watch server.js
  - id: js-tools-npm-init
    prompt: Create a `package.json` file with npm, accepting all the default answers.
    check: match
    language: shell
    solution: npm init -y
    accepted:
      - npm init --yes
  - id: js-tools-bun-init
    prompt: Start a new project in the current folder with Bun.
    check: match
    language: shell
    solution: bun init
    accepted:
      - bun init -y
  - id: js-tools-npm-install
    prompt: Install the package `lodash` with npm.
    check: match
    language: shell
    solution: npm install lodash
    accepted:
      - npm i lodash
  - id: js-tools-bun-add
    prompt: Install the package `lodash` with Bun.
    check: match
    language: shell
    solution: bun add lodash
  - id: js-tools-npm-run
    prompt: Run the script `dev` from `package.json` with npm.
    check: match
    language: shell
    solution: npm run dev
  - id: js-tools-mac-install
    prompt: Install Node.js on a Mac with Homebrew.
    check: match
    language: shell
    solution: brew install node
  - id: js-tools-windows-install
    prompt: Install the LTS version of Node.js on Windows with winget.
    check: match
    language: shell
    solution: winget install OpenJS.NodeJS.LTS
    accepted:
      - winget install --id OpenJS.NodeJS.LTS
      - winget install -e --id OpenJS.NodeJS.LTS
