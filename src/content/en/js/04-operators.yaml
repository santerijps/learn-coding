id: js-operaattorit
title: Operators
summary: Arithmetic, comparison and logical operators.
theory: |
  ### Arithmetic

  ```js
  10 + 3;  // 13
  10 - 3;  // 7
  10 * 3;  // 30
  10 / 3;  // 3.333...
  10 % 3;  // 1, the remainder
  2 ** 3;  // 8, the power
  ```

  The remainder `%` is surprisingly useful: `number % 2 === 0` tells you whether a number is even.

  ### Shorthand assignment

  ```js
  let score = 10;
  score += 5;  // same as score = score + 5
  score -= 2;
  score *= 2;
  score++;     // increase by one
  score--;     // decrease by one
  ```

  ### Comparison

  Comparisons produce a boolean (`true` or `false`):

  ```js
  5 === 5;    // true: equal (value and type)
  5 !== 3;    // true: not equal
  5 > 3;      // true
  5 <= 5;     // true
  5 === "5";  // false: different types
  ```

  Always use `===` and `!==`. The older `==` and `!=` convert types in surprising ways (`5 == "5"` is `true`).

  ### Logical operators

  - `&&` (AND) is true when both sides are true.
  - `||` (OR) is true when at least one side is true.
  - `!` (NOT) flips a boolean.

  ```js
  const age = 20;
  const hasTicket = true;
  const canEnter = age >= 18 && hasTicket; // true
  const cannotEnter = !canEnter;           // false
  ```
exercises:
  - type: choice
    question: What is the value of `10 % 3`?
    options: ['1', '3', '3.33', '0']
    answer: 0
    explanation: '`%` gives the remainder. 10 = 3 · 3 + 1, so the remainder is 1.'
  - type: blank
    question: Fill in the blank so that `isEven` tells whether `number` is even.
    code: |
      const isEven = number ___ 2 === 0;
    blanks:
      - ['%']
    explanation: A number is even when its remainder after dividing by two is zero.
  - type: bug
    question: '`same` should be `false` because the values have different types.'
    code: |
      const a = 5;
      const b = "5";
      const same = a == b;
      console.log(same);
    bugLine: 3
    explanation: '`==` converts types before comparing, so `5 == "5"` is `true`. Use strict comparison `===`.'
cards:
  - id: js-modulo
    prompt: Store the remainder of dividing `number` by three in a constant `remainder`.
    check: test
    setup: |
      const number = 17;
    tests:
      - 'remainder === 2'
    solution: |
      const remainder = number % 3;
  - id: js-is-even
    prompt: Create a constant `isEven` that is `true` if `number` is even.
    check: test
    setup: |
      const number = 8;
    tests:
      - 'isEven === true'
    solution: |
      const isEven = number % 2 === 0;
  - id: js-plus-assign
    prompt: Increase the variable `score` by ten using the `+=` operator.
    check: match
    solution: |
      score += 10;
  - id: js-increment
    prompt: Increase the variable `i` by one in the shortest possible way.
    check: match
    solution: |
      i++;
    accepted:
      - '++i;'
  - id: js-and
    prompt: Create a constant `canEnter` that is true when `age` is at least 18 **and** `hasTicket` is true.
    check: test
    setup: |
      const age = 20;
      const hasTicket = true;
    tests:
      - 'canEnter === true'
    solution: |
      const canEnter = age >= 18 && hasTicket;
  - id: js-not
    prompt: Create a constant `notRaining` whose value is the opposite of `isRaining`.
    check: test
    setup: |
      const isRaining = false;
    tests:
      - 'notRaining === true'
    solution: |
      const notRaining = !isRaining;
  - id: js-power
    prompt: Calculate `2` to the power of `10` with the `**` operator and store it in a constant `result`.
    check: test
    tests:
      - 'result === 1024'
    solution: |
      const result = 2 ** 10;
  - id: js-or
    prompt: Create a constant `dayOff` that is true when `isSaturday` **or** `isSunday` is true.
    check: test
    setup: |
      const isSaturday = false;
      const isSunday = true;
    tests:
      - 'dayOff === true'
    solution: |
      const dayOff = isSaturday || isSunday;
  - id: js-not-equal
    prompt: Create a constant `different` that is true when `a` and `b` are not equal. Use strict comparison.
    check: test
    setup: |
      const a = 5;
      const b = 7;
    tests:
      - 'different === true'
    solution: |
      const different = a !== b;
  - id: js-range-check
    prompt: Create a constant `inRange` that is true when `number` is at least `1` and at most `10`.
    check: test
    setup: |
      const number = 10;
    tests:
      - 'inRange === true'
    solution: |
      const inRange = number >= 1 && number <= 10;
  - id: js-ops-price-with-tax
    prompt: 'The string `priceText` contains a price. Convert it to a number in a constant `price`, and create a constant `total` that is the price plus 25% tax.'
    check: test
    setup: |
      const priceText = "20";
    tests:
      - 'price === 20 && total === 25'
    solution: |
      const price = Number(priceText);
      const total = price * 1.25;
  - id: js-ops-minutes-seconds
    prompt: '`totalSeconds` is a duration in seconds. Create a constant `seconds` that is the remainder of dividing it by 60, and a constant `minutes` with the whole minutes (subtract `seconds` first, then divide by 60).'
    check: test
    setup: |
      const totalSeconds = 135;
    tests:
      - 'seconds === 15 && minutes === 2'
    solution: |
      const seconds = totalSeconds % 60;
      const minutes = (totalSeconds - seconds) / 60;
  - id: js-ops-can-vote
    prompt: 'The string `ageText` contains an age. Create a constant `canVote` that is true when the age, converted to a number, is at least 18 **and** `isCitizen` is true.'
    check: test
    setup: |
      const ageText = "18";
      const isCitizen = true;
    tests:
      - 'canVote === true'
    solution: |
      const canVote = Number(ageText) >= 18 && isCitizen;
