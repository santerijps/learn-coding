id: js-luokat
title: Luokat
summary: Olioiden pohjapiirrokset, konstruktorit ja periytyminen.
theory: |
  Luokka (class) on pohjapiirros, josta voi luoda monta samanlaista oliota. Oliot luodaan `new`-avainsanalla.

  ```js
  class Henkilo {
    constructor(nimi, ika) {
      this.nimi = nimi;
      this.ika = ika;
    }

    tervehdi() {
      return `Hei, olen ${this.nimi}`;
    }
  }

  const ada = new Henkilo("Ada", 36);
  ada.tervehdi(); // "Hei, olen Ada"
  ```

  - `constructor` ajetaan, kun olio luodaan, ja se alustaa olion ominaisuudet.
  - `this` viittaa luotavaan olioon.
  - Metodit kirjoitetaan luokan sisään ilman `function`-sanaa.

  ### Periytyminen

  `extends` luo luokan, joka perii toisen luokan ominaisuudet ja metodit. `super(...)` kutsuu yliluokan konstruktoria.

  ```js
  class Elain {
    constructor(nimi) {
      this.nimi = nimi;
    }
    aantele() {
      return "...";
    }
  }

  class Koira extends Elain {
    aantele() {
      return "Hau!";
    }
  }

  new Koira("Rekku").aantele(); // "Hau!"
  ```

  Jos aliluokalla on oma konstruktori, sen täytyy kutsua `super(...)`-metodia ennen kuin se käyttää `this`-viittausta:

  ```js
  class Opiskelija extends Henkilo {
    constructor(nimi, ika, koulu) {
      super(nimi, ika);
      this.koulu = koulu;
    }
  }
  ```

  ### instanceof

  `olio instanceof Luokka` kertoo, onko olio luotu luokasta (tai sen aliluokasta).
exercises:
  - type: choice
    question: Millä avainsanalla luokasta luodaan uusi olio?
    options: ['`create`', '`new`', '`make`', '`class`']
    answer: 1
    explanation: '`new Luokka(...)` luo olion ja ajaa luokan konstruktorin.'
  - type: blank
    question: Täydennä metodin nimi, joka ajetaan oliota luotaessa.
    code: |
      class Koira {
        ___(nimi) {
          this.nimi = nimi;
        }
      }
    blanks:
      - [constructor]
    explanation: Konstruktori on metodi nimeltä `constructor`.
  - type: bug
    question: '`kasvata()` kaatuu virheeseen `ReferenceError: arvo is not defined`.'
    code: |
      class Laskuri {
        constructor() {
          this.arvo = 0;
        }
        kasvata() {
          arvo++;
        }
      }
    bugLine: 6
    explanation: 'Olion ominaisuuksiin viitataan luokan sisällä `this`-viittauksen kautta: `this.arvo++;`'
cards:
  - id: js-class-constructor
    prompt: Luo luokka `Henkilo`, jonka konstruktori tallentaa parametrin `nimi` ominaisuuteen `nimi`.
    check: test
    tests:
      - 'new Henkilo("Ada").nimi === "Ada"'
    solution: |
      class Henkilo {
        constructor(nimi) {
          this.nimi = nimi;
        }
      }
  - id: js-class-method
    prompt: 'Luo luokka `Henkilo`, jonka konstruktori ottaa parametrin `nimi` ja jonka metodi `tervehdi()` palauttaa merkkijonon `"Hei, olen <nimi>"`.'
    check: test
    tests:
      - 'new Henkilo("Ada").tervehdi() === "Hei, olen Ada"'
      - 'new Henkilo("Linus").tervehdi() === "Hei, olen Linus"'
    solution: |
      class Henkilo {
        constructor(nimi) {
          this.nimi = nimi;
        }
        tervehdi() {
          return `Hei, olen ${this.nimi}`;
        }
      }
  - id: js-class-new
    prompt: Luo valmiista luokasta `Auto` olio `auto`, jonka merkki on `"Volvo"`.
    check: test
    setup: |
      class Auto {
        constructor(merkki) {
          this.merkki = merkki;
        }
      }
    tests:
      - 'auto instanceof Auto && auto.merkki === "Volvo"'
    solution: |
      const auto = new Auto("Volvo");
  - id: js-class-state
    prompt: Luo luokka `Laskuri`, jonka ominaisuus `arvo` alkaa nollasta ja jonka metodi `kasvata()` kasvattaa arvoa yhdellä.
    check: test
    tests:
      - '(() => { const l = new Laskuri(); l.kasvata(); l.kasvata(); return l.arvo === 2; })()'
      - 'new Laskuri().arvo === 0'
    solution: |
      class Laskuri {
        constructor() {
          this.arvo = 0;
        }
        kasvata() {
          this.arvo++;
        }
      }
  - id: js-class-extends
    prompt: 'Luo luokka `Kissa`, joka perii valmiin luokan `Elain` ja jonka metodi `aantele()` palauttaa merkkijonon `"Miau"`.'
    check: test
    setup: |
      class Elain {
        constructor(nimi) {
          this.nimi = nimi;
        }
        aantele() {
          return "...";
        }
      }
    tests:
      - 'new Kissa("Mirri") instanceof Elain'
      - 'new Kissa("Mirri").aantele() === "Miau"'
      - 'new Kissa("Mirri").nimi === "Mirri"'
    solution: |
      class Kissa extends Elain {
        aantele() {
          return "Miau";
        }
      }
  - id: js-class-super
    prompt: 'Luo luokka `Opiskelija`, joka perii valmiin luokan `Henkilo`. Sen konstruktori ottaa parametrit `nimi` ja `koulu`, välittää nimen yliluokalle ja tallentaa koulun ominaisuuteen `koulu`.'
    check: test
    setup: |
      class Henkilo {
        constructor(nimi) {
          this.nimi = nimi;
        }
      }
    tests:
      - '(() => { const o = new Opiskelija("Ada", "Aalto"); return o instanceof Henkilo && o.nimi === "Ada" && o.koulu === "Aalto"; })()'
    hint: Kutsu konstruktorissa ensin `super(nimi);` ja aseta vasta sitten `this.koulu`.
    solution: |
      class Opiskelija extends Henkilo {
        constructor(nimi, koulu) {
          super(nimi);
          this.koulu = koulu;
        }
      }
  - id: js-class-default-param
    prompt: Luo luokka `Tili`, jonka konstruktori ottaa parametrin `saldo` (oletusarvo `0`) ja tallentaa sen ominaisuuteen `saldo`.
    check: test
    tests:
      - 'new Tili().saldo === 0'
      - 'new Tili(50).saldo === 50'
    solution: |
      class Tili {
        constructor(saldo = 0) {
          this.saldo = saldo;
        }
      }
  - id: js-class-method-param
    prompt: Luo luokka `Tili`, jonka `saldo` alkaa nollasta ja jonka metodi `talleta(summa)` kasvattaa saldoa annetulla summalla.
    check: test
    tests:
      - '(() => { const t = new Tili(); t.talleta(20); t.talleta(5); return t.saldo === 25; })()'
    solution: |
      class Tili {
        constructor() {
          this.saldo = 0;
        }
        talleta(summa) {
          this.saldo += summa;
        }
      }
  - id: js-class-two-instances
    prompt: Luo valmiista luokasta `Piste` kaksi oliota, `a` (x = 1, y = 2) ja `b` (x = 3, y = 4).
    check: test
    setup: |
      class Piste {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }
      }
    tests:
      - 'a instanceof Piste && a.x === 1 && a.y === 2'
      - 'b instanceof Piste && b.x === 3 && b.y === 4'
    solution: |
      const a = new Piste(1, 2);
      const b = new Piste(3, 4);
  - id: js-instanceof
    prompt: Tallenna vakioon `onElain` tieto siitä, onko `lemmikki` luokan `Elain` olio. Käytä `instanceof`-operaattoria.
    check: test
    setup: |
      class Elain {}
      class Koira extends Elain {}
      const lemmikki = new Koira();
    tests:
      - 'onElain === true'
    solution: |
      const onElain = lemmikki instanceof Elain;
  - id: js-class-cart
    prompt: 'Luo luokka `Ostoskori`, jonka `tuotteet` on aluksi tyhjä taulukko. Sen metodi `lisaa(nimi, hinta)` lisää `tuotteet`-taulukkoon olion `{ nimi, hinta }`, ja metodi `summa()` palauttaa hintojen summan.'
    check: test
    tests:
      - '(() => { const k = new Ostoskori(); k.lisaa("tee", 3); k.lisaa("kakku", 5); return k.summa() === 8 && k.tuotteet.length === 2 && k.tuotteet[0].nimi === "tee"; })()'
      - 'new Ostoskori().summa() === 0'
    solution: |
      class Ostoskori {
        constructor() {
          this.tuotteet = [];
        }
        lisaa(nimi, hinta) {
          this.tuotteet.push({ nimi, hinta });
        }
        summa() {
          return this.tuotteet.reduce((yhteensa, tuote) => yhteensa + tuote.hinta, 0);
        }
      }
  - id: js-class-withdraw
    prompt: 'Luo luokka `Tili`, jonka `saldo` alkaa nollasta ja jolla on metodit `talleta(summa)` ja `nosta(summa)`. Jos summa on saldoa suurempi, `nosta` palauttaa `false` eikä muuta mitään; muuten se vähentää summan ja palauttaa `true`.'
    check: test
    tests:
      - '(() => { const t = new Tili(); t.talleta(50); return t.nosta(80) === false && t.saldo === 50 && t.nosta(20) === true && t.saldo === 30; })()'
    solution: |
      class Tili {
        constructor() {
          this.saldo = 0;
        }
        talleta(summa) {
          this.saldo += summa;
        }
        nosta(summa) {
          if (summa > this.saldo) {
            return false;
          }
          this.saldo -= summa;
          return true;
        }
      }
  - id: js-class-todo
    prompt: 'Luo luokka `Tehtavalista`, jolla on taulukko `tehtavat`. Sen metodi `lisaa(teksti)` lisää olion `{ teksti, tehty: false }`, `merkitse(indeksi)` merkitsee sen kohdan tehtävän tehdyksi ja `jaljella()` palauttaa, montako tehtävää on tekemättä.'
    check: test
    tests:
      - '(() => { const l = new Tehtavalista(); l.lisaa("kauppa"); l.lisaa("kokkaa"); l.lisaa("syö"); l.merkitse(1); return l.jaljella() === 2 && l.tehtavat[1].tehty === true && l.tehtavat[0].teksti === "kauppa"; })()'
    solution: |
      class Tehtavalista {
        constructor() {
          this.tehtavat = [];
        }
        lisaa(teksti) {
          this.tehtavat.push({ teksti, tehty: false });
        }
        merkitse(indeksi) {
          this.tehtavat[indeksi].tehty = true;
        }
        jaljella() {
          return this.tehtavat.filter((tehtava) => !tehtava.tehty).length;
        }
      }
