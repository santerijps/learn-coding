id: js-ehtolauseet
title: Ehtolauseet
summary: Päätösten tekeminen if-, else- ja ternary-rakenteilla.
theory: |
  Ehtolause suorittaa koodin vain, jos ehto on tosi.

  ```js
  const lampotila = 28;

  if (lampotila > 25) {
    console.log("Kuuma");
  } else if (lampotila > 15) {
    console.log("Lämmin");
  } else {
    console.log("Viileä");
  }
  ```

  Ehdot tarkistetaan ylhäältä alas, ja vain **ensimmäinen** tosi haara suoritetaan. `else` on vapaaehtoinen, ja se suoritetaan, jos mikään ehto ei ollut tosi.

  ### Ternary-operaattori

  Kun valitaan kahdesta arvosta, ehtolausekkeen `ehto ? arvoJosTosi : arvoJosEpätosi` voi kirjoittaa yhdelle riville:

  ```js
  const ika = 20;
  const tila = ika >= 18 ? "aikuinen" : "alaikäinen";
  ```

  ### Truthy ja falsy

  Ehdoksi kelpaa mikä tahansa arvo. Nämä arvot tulkitaan epätosiksi (**falsy**): `false`, `0`, `""` (tyhjä merkkijono), `null`, `undefined` ja `NaN`. Kaikki muut arvot ovat tosia (**truthy**).

  ```js
  const nimi = "";
  if (nimi) {
    console.log(`Hei ${nimi}`);
  } else {
    console.log("Nimi puuttuu");
  }
  ```

  ### Oletusarvo ||-operaattorilla

  `a || b` palauttaa arvon `a`, jos se on truthy, ja muuten arvon `b`. Tätä käytetään usein oletusarvon antamiseen:

  ```js
  const syote = "";
  const nimi = syote || "Anonyymi"; // "Anonyymi"
  ```
exercises:
  - type: choice
    question: Mikä näistä arvoista on falsy?
    options: ['`"0"`', '`0`', '`"false"`', '`[]`']
    answer: 1
    explanation: Luku `0` on falsy. Merkkijonot `"0"` ja `"false"` eivät ole tyhjiä, joten ne ovat truthy. Myös tyhjä taulukko `[]` on truthy.
  - type: blank
    question: Täydennä rakenne, joka tulostaa `Ei kuuma`, kun ehto ei ole tosi.
    code: |
      if (lampotila > 25) {
        console.log("Kuuma");
      } ___ {
        console.log("Ei kuuma");
      }
    blanks:
      - [else]
    explanation: '`else`-haara suoritetaan, kun yksikään edellisistä ehdoista ei ollut tosi.'
  - type: bug
    question: Ohjelma tulostaa `Täysi-ikäinen`, vaikka `ika` on 16.
    code: |
      const ika = 16;
      if (ika >= 18); {
        console.log("Täysi-ikäinen");
      }
    bugLine: 2
    explanation: 'Puolipiste ehdon perässä päättää if-lauseen heti, joten aaltosulkeiden lohko suoritetaan aina. Poista puolipiste: `if (ika >= 18) {`'
cards:
  - id: js-if-simple
    prompt: Tulosta `Pakkasta`, jos `lampotila` on alle nollan.
    check: test
    setup: |
      const lampotila = -5;
    tests:
      - '__logs.length === 1 && __logs[0] === "Pakkasta"'
    solution: |
      if (lampotila < 0) {
        console.log("Pakkasta");
      }
  - id: js-if-else
    prompt: Tulosta `Parillinen` tai `Pariton` sen mukaan, onko `luku` parillinen.
    check: test
    setup: |
      const luku = 7;
    tests:
      - '__logs.length === 1 && __logs[0] === "Pariton"'
    solution: |
      if (luku % 2 === 0) {
        console.log("Parillinen");
      } else {
        console.log("Pariton");
      }
  - id: js-else-if
    prompt: 'Aseta muuttujaan `arvosana` arvo `"A"`, jos `pisteet` ≥ 90, `"B"`, jos `pisteet` ≥ 70, ja muuten `"C"`.'
    check: test
    setup: |
      const pisteet = 75;
    tests:
      - 'arvosana === "B"'
    hint: Esittele ensin `let arvosana;` ja aseta arvo sitten if / else if / else -rakenteessa.
    solution: |
      let arvosana;
      if (pisteet >= 90) {
        arvosana = "A";
      } else if (pisteet >= 70) {
        arvosana = "B";
      } else {
        arvosana = "C";
      }
  - id: js-ternary
    prompt: 'Luo vakio `tila` ternary-operaattorilla: `"auki"`, jos `onAuki` on tosi, muuten `"kiinni"`.'
    check: test
    setup: |
      const onAuki = false;
    tests:
      - 'tila === "kiinni"'
    solution: |
      const tila = onAuki ? "auki" : "kiinni";
  - id: js-truthy-check
    prompt: Tulosta `Tervetuloa`, jos `kayttaja` ei ole tyhjä merkkijono, ja muuten `Kirjaudu sisään`.
    check: test
    setup: |
      const kayttaja = "";
    tests:
      - '__logs.length === 1 && __logs[0] === "Kirjaudu sisään"'
    solution: |
      if (kayttaja) {
        console.log("Tervetuloa");
      } else {
        console.log("Kirjaudu sisään");
      }
  - id: js-if-equals
    prompt: Tulosta `Oikein!`, jos `vastaus` on täsmälleen `42`.
    check: test
    setup: |
      const vastaus = 42;
    tests:
      - '__logs.length === 1 && __logs[0] === "Oikein!"'
    solution: |
      if (vastaus === 42) {
        console.log("Oikein!");
      }
  - id: js-sign
    prompt: 'Aseta muuttujaan `merkki` arvo `"positiivinen"`, `"negatiivinen"` tai `"nolla"` luvun `luku` mukaan.'
    check: test
    setup: |
      const luku = 0;
    tests:
      - 'merkki === "nolla"'
    solution: |
      let merkki;
      if (luku > 0) {
        merkki = "positiivinen";
      } else if (luku < 0) {
        merkki = "negatiivinen";
      } else {
        merkki = "nolla";
      }
  - id: js-ternary-plural
    prompt: 'Luo vakio `teksti` ternary-operaattorilla: `"1 viesti"`, jos `maara` on 1, ja muuten esimerkiksi `"3 viestiä"`.'
    check: test
    setup: |
      const maara = 3;
    tests:
      - 'teksti === "3 viestiä"'
    solution: |
      const teksti = maara === 1 ? "1 viesti" : `${maara} viestiä`;
  - id: js-if-and-else
    prompt: Tulosta `Tervetuloa`, jos sekä `kirjautunut` että `onAdmin` ovat tosia, ja muuten `Ei pääsyä`.
    check: test
    setup: |
      const kirjautunut = true;
      const onAdmin = false;
    tests:
      - '__logs.length === 1 && __logs[0] === "Ei pääsyä"'
    solution: |
      if (kirjautunut && onAdmin) {
        console.log("Tervetuloa");
      } else {
        console.log("Ei pääsyä");
      }
  - id: js-or-default
    prompt: 'Luo vakio `nimi`, jonka arvo on `syote`, jos se on truthy, ja muuten `"Anonyymi"`.'
    check: test
    setup: |
      const syote = "";
    tests:
      - 'nimi === "Anonyymi"'
    hint: '`||` palauttaa oikean puolen, kun vasen puoli on falsy.'
    solution: |
      const nimi = syote || "Anonyymi";
  - id: js-if-password-length
    prompt: 'Tulosta `Liian lyhyt`, jos `salasana`-merkkijonossa on alle 8 merkkiä, ja muuten `OK`.'
    check: test
    setup: |
      const salasana = "abc123";
    tests:
      - '__logs.join(",") === "Liian lyhyt"'
    solution: |
      if (salasana.length < 8) {
        console.log("Liian lyhyt");
      } else {
        console.log("OK");
      }
  - id: js-if-member-discount
    prompt: 'Luo muuttuja `yhteensa`, joka on `hinta` vähennettynä 10 %:lla, kun `onJasen` on tosi ja `hinta` on vähintään 50, ja muuten pelkkä `hinta`.'
    check: test
    setup: |
      const hinta = 80;
      const onJasen = true;
    tests:
      - 'yhteensa === 72'
    solution: |
      let yhteensa = hinta;
      if (onJasen && hinta >= 50) {
        yhteensa = hinta * 0.9;
      }
  - id: js-if-number-input
    prompt: 'Muunna merkkijono `syote` luvuksi. Jos tulos on NaN, tulosta `Ei luku`; muuten tulosta luku kaksinkertaisena.'
    check: test
    setup: |
      const syote = "abc";
    tests:
      - '__logs.join(",") === "Ei luku"'
    solution: |
      const luku = Number(syote);
      if (Number.isNaN(luku)) {
        console.log("Ei luku");
      } else {
        console.log(luku * 2);
      }
