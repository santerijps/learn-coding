id: js-nuolifunktiot
title: Nuolifunktiot ja oletusarvot
summary: Lyhyempi funktiosyntaksi ja funktiot arvoina.
theory: |
  Nuolifunktio on lyhyempi tapa kirjoittaa funktio. Modernissa JavaScriptissä sitä käytetään erittäin paljon.

  ```js
  // Tavallinen funktio
  function tuplaa(x) {
    return x * 2;
  }

  // Sama nuolifunktiona
  const tuplaa2 = (x) => {
    return x * 2;
  };

  // Lyhin muoto: yksi lauseke palautetaan automaattisesti
  const tuplaa3 = (x) => x * 2;
  ```

  Jos nuolen jälkeen tulee aaltosulkeet `{ }`, paluuarvo täytyy kirjoittaa `return`-lauseella. Ilman aaltosulkeita lausekkeen arvo palautetaan automaattisesti.

  Yhden parametrin ympäriltä voi jättää sulut pois (`x => x * 2`). Ilman parametreja kirjoitetaan tyhjät sulut: `() => "hei"`.

  ### Oletusarvot

  Parametrille voi antaa oletusarvon, jota käytetään, kun argumentti puuttuu:

  ```js
  const tervehdi = (nimi = "vieras") => `Hei ${nimi}!`;
  tervehdi("Ada"); // "Hei Ada!"
  tervehdi();      // "Hei vieras!"
  ```

  ### Funktiot ovat arvoja

  Funktion voi tallentaa muuttujaan ja antaa argumenttina toiselle funktiolle. Argumenttina annettua funktiota kutsutaan **callbackiksi**. Tätä käytetään jatkuvasti, esimerkiksi taulukkometodeissa ja tapahtumankäsittelijöissä.

  ```js
  const suorita = (f) => f();
  suorita(() => console.log("Kutsuttiin!"));
  ```
exercises:
  - type: choice
    question: Mitä kutsu `f(2)` palauttaa, kun `const f = x => x + 1;`?
    options: ['`3`', '`undefined`', '`"x + 1"`', Virheen]
    answer: 0
    explanation: Ilman aaltosulkeita nuolifunktio palauttaa lausekkeen arvon automaattisesti, eli 2 + 1 = 3.
  - type: blank
    question: Täydennä nuolifunktion syntaksi.
    code: |
      const tuplaa = (x) ___ x * 2;
    blanks:
      - ['=>']
    explanation: Nuolifunktion parametrit ja runko erotetaan nuolella `=>`.
  - type: bug
    question: '`kerro(2, 3)` palauttaa `undefined`, vaikka sen pitäisi palauttaa `6`.'
    code: |
      const kerro = (a, b) => {
        a * b;
      };
      console.log(kerro(2, 3));
    bugLine: 2
    explanation: 'Kun nuolifunktiossa käytetään aaltosulkeita, paluuarvo täytyy kirjoittaa `return`-lauseella: `return a * b;`. Toinen vaihtoehto on poistaa aaltosulkeet: `(a, b) => a * b`.'
cards:
  - id: js-arrow-basic
    prompt: Kirjoita nuolifunktio `tuplaa`, joka palauttaa luvun kaksinkertaisena.
    check: test
    tests:
      - 'tuplaa(4) === 8'
      - '!Object.hasOwn(tuplaa, "prototype")'
    solution: |
      const tuplaa = (x) => x * 2;
  - id: js-arrow-boolean
    prompt: Kirjoita nuolifunktio `onTyhja(s)`, joka palauttaa `true`, jos merkkijono on tyhjä.
    check: test
    tests:
      - 'onTyhja("") === true'
      - 'onTyhja("a") === false'
      - '!Object.hasOwn(onTyhja, "prototype")'
    solution: |
      const onTyhja = (s) => s.length === 0;
  - id: js-default-param
    prompt: 'Kirjoita funktio `tervehdi(nimi)`, joka palauttaa `` `Hei ${nimi}!` ``. Jos nimeä ei anneta, käytetään oletusarvoa `"vieras"`.'
    check: test
    tests:
      - 'tervehdi("Ada") === "Hei Ada!"'
      - 'tervehdi() === "Hei vieras!"'
    solution: |
      const tervehdi = (nimi = "vieras") => `Hei ${nimi}!`;
  - id: js-callback
    prompt: Kirjoita funktio `suorita(f)`, joka kutsuu sille annettua funktiota ja palauttaa sen paluuarvon.
    check: test
    tests:
      - 'suorita(() => 5) === 5'
      - 'suorita(() => "ok") === "ok"'
    solution: |
      const suorita = (f) => f();
  - id: js-arrow-two-params
    prompt: Kirjoita nuolifunktio `keskiarvo(a, b)`, joka palauttaa kahden luvun keskiarvon.
    check: test
    tests:
      - 'keskiarvo(2, 4) === 3'
      - 'keskiarvo(1, 2) === 1.5'
      - '!Object.hasOwn(keskiarvo, "prototype")'
    solution: |
      const keskiarvo = (a, b) => (a + b) / 2;
  - id: js-arrow-no-params
    prompt: 'Kirjoita parametriton nuolifunktio `moikkaa`, joka palauttaa merkkijonon `"Moi!"`.'
    check: test
    tests:
      - 'moikkaa() === "Moi!"'
      - '!Object.hasOwn(moikkaa, "prototype")'
    solution: |
      const moikkaa = () => "Moi!";
  - id: js-arrow-block-body
    prompt: 'Kirjoita aaltosulkeellinen nuolifunktio `luokittele(x)`, joka palauttaa `"iso"`, jos `x` on yli 100, ja muuten `"pieni"`.'
    check: test
    tests:
      - 'luokittele(150) === "iso"'
      - 'luokittele(100) === "pieni"'
      - '!Object.hasOwn(luokittele, "prototype")'
    solution: |
      const luokittele = (x) => {
        if (x > 100) {
          return "iso";
        }
        return "pieni";
      };
  - id: js-default-exponent
    prompt: Kirjoita funktio `potenssi(kanta, eksponentti)`, jossa eksponentin oletusarvo on `2`.
    check: test
    tests:
      - 'potenssi(3) === 9'
      - 'potenssi(2, 3) === 8'
    solution: |
      const potenssi = (kanta, eksponentti = 2) => kanta ** eksponentti;
  - id: js-callback-twice
    prompt: Kirjoita funktio `kahdesti(f)`, joka kutsuu sille annettua funktiota kaksi kertaa.
    check: test
    tests:
      - '(() => { let n = 0; kahdesti(() => n++); return n === 2; })()'
    solution: |
      const kahdesti = (f) => {
        f();
        f();
      };
  - id: js-callback-apply
    prompt: Kirjoita funktio `sovella(f, x)`, joka kutsuu funktiota `f` argumentilla `x` ja palauttaa tuloksen.
    check: test
    tests:
      - 'sovella((n) => n + 1, 1) === 2'
      - 'sovella((s) => s.length, "abc") === 3'
    solution: |
      const sovella = (f, x) => f(x);
  - id: js-arrow-initial
    prompt: 'Kirjoita nuolifunktio `alkukirjain(nimi)`, joka palauttaa nimen ensimmäisen kirjaimen isona ja pisteen perässä: `alkukirjain("ada")` palauttaa `"A."`.'
    check: test
    tests:
      - 'alkukirjain("ada") === "A." && alkukirjain("Linus") === "L."'
    solution: |
      const alkukirjain = (nimi) => `${nimi[0].toUpperCase()}.`;
  - id: js-arrow-tax-default
    prompt: 'Kirjoita nuolifunktio `verollinen(hinta, vero)`, joka palauttaa hinnan veron kanssa: `hinta * (1 + vero)`. Veron oletusarvo on `0.25`.'
    check: test
    tests:
      - 'verollinen(100) === 125'
      - 'verollinen(100, 0.5) === 150'
    solution: |
      const verollinen = (hinta, vero = 0.25) => hinta * (1 + vero);
  - id: js-arrow-describe
    prompt: 'Kirjoita funktio `kuvaa(n, f)`, joka kutsuu funktiota `f` luvulla `n` ja palauttaa merkkijonon kuten `"3 → 6"`: luvun, nuolen `→` ja tuloksen.'
    check: test
    tests:
      - 'kuvaa(3, (x) => x * 2) === "3 → 6"'
      - 'kuvaa(5, (x) => x + 1) === "5 → 6"'
    solution: |
      function kuvaa(n, f) {
        return `${n} → ${f(n)}`;
      }
