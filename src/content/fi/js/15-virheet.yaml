id: js-virheet
title: Virheenkäsittely
summary: Virheiden heittäminen ja kiinni ottaminen try/catch-rakenteella.
theory: |
  Ohjelmissa tapahtuu virheitä: verkko katkeaa, syöte on rikki tai tiedosto puuttuu. Käsittelemätön virhe kaataa ohjelman. `try/catch` ottaa virheen kiinni, jotta siihen voi reagoida hallitusti.

  ```js
  try {
    const data = JSON.parse("{ rikki");
    console.log(data);
  } catch (virhe) {
    console.log("Jäsennys epäonnistui:", virhe.message);
  } finally {
    console.log("Tämä ajetaan aina");
  }
  ```

  - `try`-lohkon koodi suoritetaan, kunnes tapahtuu virhe.
  - `catch` saa virheolion, ja virheen kuvaus on sen ominaisuudessa `message`.
  - `finally` suoritetaan aina, tapahtui virhe tai ei. Sitä käytetään esimerkiksi siivoamiseen.

  ### Virheen heittäminen

  Omassa koodissa virhe heitetään `throw`-lauseella. Heitä aina `Error`-olio, älä pelkkää merkkijonoa, jotta virheestä saadaan mukaan myös pinojälki:

  ```js
  function jaa(a, b) {
    if (b === 0) {
      throw new Error("Nollalla ei voi jakaa");
    }
    return a / b;
  }
  ```

  ### Milloin catch?

  Ota virhe kiinni siellä, missä osaat tehdä sille jotain järkevää, kuten näyttää viestin, yrittää uudelleen tai käyttää oletusarvoa. Tyhjä `catch {}` piilottaa ongelmat, joten vältä sitä.
exercises:
  - type: choice
    question: Mikä lohko suoritetaan aina, tapahtui virhe tai ei?
    options: ['`try`', '`catch`', '`finally`', '`throw`']
    answer: 2
    explanation: '`finally` ajetaan aina `try`- ja `catch`-lohkojen jälkeen.'
  - type: blank
    question: Täydennä niin, että funktio heittää virheen.
    code: |
      ___ new Error("Virheellinen syöte");
    blanks:
      - [throw]
    explanation: Virhe heitetään `throw`-lauseella.
  - type: bug
    question: '`catch` tulostaa `undefined` virheviestin sijaan.'
    code: |
      try {
        const tulos = JSON.parse("{ rikki");
        console.log(tulos);
      } catch (virhe) {
        console.log(virhe.mesage);
      }
    bugLine: 5
    explanation: 'Ominaisuuden nimessä on kirjoitusvirhe. Oikea nimi on `message`, joten kirjoita `virhe.message`.'
cards:
  - id: js-throw-error
    prompt: 'Kirjoita funktio `jaa(a, b)`, joka heittää virheen `new Error("Nollalla ei voi jakaa")`, jos `b` on nolla, ja muuten palauttaa osamäärän.'
    check: test
    tests:
      - 'jaa(6, 3) === 2'
      - '(() => { try { jaa(1, 0); return false; } catch (e) { return e instanceof Error && e.message === "Nollalla ei voi jakaa"; } })()'
    solution: |
      function jaa(a, b) {
        if (b === 0) {
          throw new Error("Nollalla ei voi jakaa");
        }
        return a / b;
      }
  - id: js-try-catch-json
    prompt: Jäsennä merkkijono `json` muuttujaan `data` käyttäen `JSON.parse`-funktiota. Jos jäsennys epäonnistuu, aseta muuttujan `data` arvoksi `null`.
    check: test
    setup: |
      const json = "{ rikki";
    tests:
      - 'data === null'
    solution: |
      let data;
      try {
        data = JSON.parse(json);
      } catch {
        data = null;
      }
  - id: js-catch-message
    prompt: Kirjoita funktio `turvallinen(f)`, joka kutsuu funktiota `f` ja palauttaa sen paluuarvon. Jos `f` heittää virheen, funktio palauttaa virheen viestin (`message`).
    check: test
    tests:
      - 'turvallinen(() => 1) === 1'
      - 'turvallinen(() => { throw new Error("hups"); }) === "hups"'
    solution: |
      function turvallinen(f) {
        try {
          return f();
        } catch (virhe) {
          return virhe.message;
        }
      }
  - id: js-finally
    prompt: Kutsu funktiota `riskialtis()` niin, että sen heittämä virhe otetaan kiinni, ja tulosta `Valmis` finally-lohkossa.
    check: test
    setup: |
      function riskialtis() {
        throw new Error("pum");
      }
    tests:
      - '__logs.includes("Valmis")'
    solution: |
      try {
        riskialtis();
      } catch (virhe) {
        console.log(virhe.message);
      } finally {
        console.log("Valmis");
      }
  - id: js-error-object
    prompt: 'Luo vakio `virhe`, joka on uusi `Error`-olio viestillä `"Hups"`, ja tulosta virheen viesti.'
    check: test
    tests:
      - 'virhe instanceof Error && virhe.message === "Hups"'
      - '__logs[0] === "Hups"'
    solution: |
      const virhe = new Error("Hups");
      console.log(virhe.message);
  - id: js-throw-validate
    prompt: 'Kirjoita funktio `tarkistaIka(ika)`, joka heittää virheen `new Error("Ikä ei voi olla negatiivinen")`, jos ikä on alle nollan, ja muuten palauttaa iän.'
    check: test
    tests:
      - 'tarkistaIka(30) === 30'
      - '(() => { try { tarkistaIka(-1); return false; } catch (e) { return e.message === "Ikä ei voi olla negatiivinen"; } })()'
    solution: |
      function tarkistaIka(ika) {
        if (ika < 0) {
          throw new Error("Ikä ei voi olla negatiivinen");
        }
        return ika;
      }
  - id: js-catch-log
    prompt: Kutsu funktiota `lataa()` try/catch-rakenteen sisällä ja tulosta virheen viesti, jos kutsu epäonnistuu.
    check: test
    setup: |
      function lataa() {
        throw new Error("Tiedostoa ei löytynyt");
      }
    tests:
      - '__logs[0] === "Tiedostoa ei löytynyt"'
    solution: |
      try {
        lataa();
      } catch (virhe) {
        console.log(virhe.message);
      }
  - id: js-parse-number-or-throw
    prompt: 'Kirjoita funktio `lueLuku(teksti)`, joka palauttaa `Number(teksti)`, mutta heittää virheen `new Error("Ei luku")`, jos tulos on NaN.'
    check: test
    tests:
      - 'lueLuku("5") === 5'
      - '(() => { try { lueLuku("kissa"); return false; } catch (e) { return e.message === "Ei luku"; } })()'
    solution: |
      function lueLuku(teksti) {
        const luku = Number(teksti);
        if (Number.isNaN(luku)) {
          throw new Error("Ei luku");
        }
        return luku;
      }
  - id: js-parse-or-default
    prompt: Kirjoita funktio `jasenna(json)`, joka palauttaa `JSON.parse(json)`-kutsun tuloksen, tai tyhjän olion `{}`, jos jäsennys epäonnistuu.
    check: test
    tests:
      - 'jasenna(''{"a": 1}'').a === 1'
      - 'JSON.stringify(jasenna("rikki")) === "{}"'
    solution: |
      function jasenna(json) {
        try {
          return JSON.parse(json);
        } catch {
          return {};
        }
      }
  - id: js-try-flag
    prompt: Aseta muuttujan `onnistui` arvoksi `true`, jos `JSON.parse(syote)` onnistuu, ja `false`, jos se heittää virheen.
    check: test
    setup: |
      const syote = '{"ok": true}';
    tests:
      - 'onnistui === true'
    solution: |
      let onnistui;
      try {
        JSON.parse(syote);
        onnistui = true;
      } catch {
        onnistui = false;
      }
  - id: js-error-withdraw
    prompt: 'Luo luokka `Tili`, jonka konstruktori saa parametrin `saldo` ja jonka metodi `nosta(summa)` heittää virheen `new Error("Saldo ei riitä")`, jos summa on saldoa suurempi, ja muuten vähentää sen.'
    check: test
    tests:
      - '(() => { const t = new Tili(50); t.nosta(20); return t.saldo === 30; })()'
      - '(() => { const t = new Tili(10); try { t.nosta(20); return false; } catch (e) { return e.message === "Saldo ei riitä" && t.saldo === 10; } })()'
    solution: |
      class Tili {
        constructor(saldo) {
          this.saldo = saldo;
        }
        nosta(summa) {
          if (summa > this.saldo) {
            throw new Error("Saldo ei riitä");
          }
          this.saldo -= summa;
        }
      }
  - id: js-error-parse-numbers
    prompt: 'Kirjoita funktio `luvuiksi(tekstit)`, joka muuntaa merkkijonotaulukon luvuiksi `Number`-funktiolla ja palauttaa ne. Jos jokin niistä on NaN, heitä virhe `` new Error(`Ei luku: ${teksti}`) ``.'
    check: test
    tests:
      - 'luvuiksi(["1", "2.5"]).join(",") === "1,2.5"'
      - '(() => { try { luvuiksi(["1", "x"]); return false; } catch (e) { return e.message === "Ei luku: x"; } })()'
    solution: |
      function luvuiksi(tekstit) {
        const luvut = [];
        for (const teksti of tekstit) {
          const luku = Number(teksti);
          if (Number.isNaN(luku)) {
            throw new Error(`Ei luku: ${teksti}`);
          }
          luvut.push(luku);
        }
        return luvut;
      }
  - id: js-error-read-setting
    prompt: 'Kirjoita funktio `lueAsetus(json, avain)`, joka jäsentää JSON-merkkijonon ja palauttaa ominaisuuden `avain` arvon. Jos jäsentäminen epäonnistuu, palauta `null`.'
    check: test
    tests:
      - 'lueAsetus(''{"teema":"tumma"}'', "teema") === "tumma"'
      - 'lueAsetus("hups", "teema") === null'
    solution: |
      function lueAsetus(json, avain) {
        try {
          const asetukset = JSON.parse(json);
          return asetukset[avain];
        } catch {
          return null;
        }
      }
