id: js-silmukat
title: Silmukat
summary: Toistaminen for-, for...of- ja while-silmukoilla.
theory: |
  Silmukka toistaa koodia. JavaScriptin yleisimmät silmukat ovat nämä kolme.

  ### for

  Klassinen laskurisilmukka: `for (alustus; ehto; päivitys)`.

  ```js
  for (let i = 0; i < 3; i++) {
    console.log(i); // 0, 1, 2
  }
  ```

  ### for...of

  Käy läpi taulukon (tai merkkijonon) alkiot. Tämä on luettavin tapa, kun indeksiä ei tarvita.

  ```js
  const nimet = ["Ada", "Linus", "Grace"];
  for (const nimi of nimet) {
    console.log(nimi);
  }
  ```

  ### while

  Toistaa niin kauan kuin ehto on tosi. Muista päivittää ehtoon vaikuttava arvo, ettei silmukasta tule ikuista.

  ```js
  let i = 3;
  while (i > 0) {
    console.log(i);
    i--;
  }
  ```

  ### break ja continue

  `break` lopettaa silmukan kokonaan, ja `continue` hyppää seuraavaan kierrokseen.

  ### Kerääjä

  Yleinen kaava on laskea tulos silmukassa muuttujaan:

  ```js
  const luvut = [4, 8, 15];
  let summa = 0;
  for (const luku of luvut) {
    summa += luku;
  }
  // summa on 27
  ```
exercises:
  - type: choice
    question: Montako kertaa silmukka `for (let i = 0; i < 3; i++)` suoritetaan?
    options: ['2', '3', '4', Loputtomasti]
    answer: 1
    explanation: 'Muuttuja `i` saa arvot 0, 1 ja 2. Kun `i` on 3, ehto `i < 3` on epätosi ja silmukka päättyy.'
  - type: blank
    question: Täydennä silmukka, joka käy läpi taulukon `nimet` alkiot.
    code: |
      for (const nimi ___ nimet) {
        console.log(nimi);
      }
    blanks:
      - [of]
    explanation: '`for...of` käy läpi taulukon alkiot järjestyksessä.'
  - type: bug
    question: Summan pitäisi olla `6`, mutta tulos on `NaN`.
    code: |
      const luvut = [1, 2, 3];
      let summa = 0;
      for (let i = 0; i <= luvut.length; i++) {
        summa += luvut[i];
      }
      console.log(summa);
    bugLine: 3
    explanation: 'Ehto `<=` vie silmukan yhden indeksin liian pitkälle. `luvut[3]` on `undefined`, ja luku + `undefined` on `NaN`. Käytä ehtoa `i < luvut.length`.'
cards:
  - id: js-for-count
    prompt: Tulosta for-silmukalla luvut 1–5, jokainen omalle rivilleen.
    check: test
    tests:
      - '__logs.join(",") === "1,2,3,4,5"'
    solution: |
      for (let i = 1; i <= 5; i++) {
        console.log(i);
      }
  - id: js-for-of
    prompt: Tulosta for...of-silmukalla jokainen taulukon `nimet` nimi.
    check: test
    setup: |
      const nimet = ["Ada", "Linus"];
    tests:
      - '__logs.join(",") === "Ada,Linus"'
    solution: |
      for (const nimi of nimet) {
        console.log(nimi);
      }
  - id: js-loop-sum
    prompt: Laske taulukon `luvut` alkioiden summa silmukalla muuttujaan `summa`.
    check: test
    setup: |
      const luvut = [4, 8, 15, 16];
    tests:
      - 'summa === 43'
    solution: |
      let summa = 0;
      for (const luku of luvut) {
        summa += luku;
      }
  - id: js-loop-count-even
    prompt: Laske muuttujaan `parilliset`, montako parillista lukua taulukossa `luvut` on.
    check: test
    setup: |
      const luvut = [1, 2, 3, 4, 6];
    tests:
      - 'parilliset === 3'
    solution: |
      let parilliset = 0;
      for (const luku of luvut) {
        if (luku % 2 === 0) {
          parilliset++;
        }
      }
  - id: js-for-down
    prompt: Tulosta silmukalla luvut 10, 8, 6, 4 ja 2 tässä järjestyksessä.
    check: test
    tests:
      - '__logs.join(",") === "10,8,6,4,2"'
    solution: |
      for (let i = 10; i > 0; i -= 2) {
        console.log(i);
      }
  - id: js-loop-find-index
    prompt: Kirjoita funktio `etsi(taulukko, haettava)`, joka palauttaa haettavan alkion indeksin silmukalla, tai `-1`, jos alkiota ei löydy.
    check: test
    tests:
      - 'etsi([5, 7, 9], 9) === 2'
      - 'etsi([1], 3) === -1'
      - '!String(etsi).includes("indexOf")'
    solution: |
      function etsi(taulukko, haettava) {
        for (let i = 0; i < taulukko.length; i++) {
          if (taulukko[i] === haettava) {
            return i;
          }
        }
        return -1;
      }
  - id: js-while-countdown
    prompt: Tulosta while-silmukalla luvut `3`, `2` ja `1` tässä järjestyksessä.
    check: test
    tests:
      - '__logs.join(",") === "3,2,1"'
    solution: |
      let i = 3;
      while (i > 0) {
        console.log(i);
        i--;
      }
  - id: js-loop-max
    prompt: Etsi silmukalla taulukon `luvut` suurin luku muuttujaan `suurin`. Älä käytä `Math.max`-funktiota.
    check: test
    setup: |
      const luvut = [3, 17, 8, 12];
    tests:
      - 'suurin === 17'
    solution: |
      let suurin = luvut[0];
      for (const luku of luvut) {
        if (luku > suurin) {
          suurin = luku;
        }
      }
  - id: js-loop-break
    prompt: Tulosta taulukon `luvut` alkiot järjestyksessä, mutta lopeta silmukka `break`-lauseella heti, kun vastaan tulee negatiivinen luku.
    check: test
    setup: |
      const luvut = [4, 7, -1, 9];
    tests:
      - '__logs.join(",") === "4,7"'
    solution: |
      for (const luku of luvut) {
        if (luku < 0) {
          break;
        }
        console.log(luku);
      }
  - id: js-loop-chars
    prompt: Laske silmukalla, montako `"a"`-kirjainta merkkijonossa `sana` on, ja tallenna määrä muuttujaan `maara`.
    check: test
    setup: |
      const sana = "banaani";
    tests:
      - 'maara === 3'
    solution: |
      let maara = 0;
      for (const kirjain of sana) {
        if (kirjain === "a") {
          maara++;
        }
      }
  - id: js-loop-fizzbuzz
    prompt: 'Tulosta silmukalla luvut 1–15, mutta tulosta 3:lla jaollisten lukujen tilalle `Fizz`, 5:llä jaollisten tilalle `Buzz` ja molemmilla jaollisten tilalle `FizzBuzz`.'
    check: test
    tests:
      - '__logs.join(",") === "1,2,Fizz,4,Buzz,Fizz,7,8,Fizz,Buzz,11,Fizz,13,14,FizzBuzz"'
    solution: |
      for (let i = 1; i <= 15; i++) {
        if (i % 15 === 0) {
          console.log("FizzBuzz");
        } else if (i % 3 === 0) {
          console.log("Fizz");
        } else if (i % 5 === 0) {
          console.log("Buzz");
        } else {
          console.log(i);
        }
      }
  - id: js-loop-sum-positive
    prompt: 'Kirjoita funktio `positiivistenSumma(luvut)`, joka laskee silmukalla yhteen vain taulukon positiiviset luvut ja palauttaa summan.'
    check: test
    tests:
      - 'positiivistenSumma([3, -2, 5, -1]) === 8'
      - 'positiivistenSumma([-1, -2]) === 0'
    solution: |
      function positiivistenSumma(luvut) {
        let summa = 0;
        for (const luku of luvut) {
          if (luku > 0) {
            summa += luku;
          }
        }
        return summa;
      }
  - id: js-loop-longest-word
    prompt: 'Kirjoita funktio `pisinSana(lause)`, joka jakaa lauseen sanoiksi ja palauttaa silmukalla niistä pisimmän. Jos useampi on yhtä pitkä, palauta ensimmäinen.'
    check: test
    tests:
      - 'pisinSana("opin JavaScriptiä tänään") === "JavaScriptiä"'
      - 'pisinSana("kissa koira") === "kissa"'
    solution: |
      function pisinSana(lause) {
        let pisin = "";
        for (const sana of lause.split(" ")) {
          if (sana.length > pisin.length) {
            pisin = sana;
          }
        }
        return pisin;
      }
